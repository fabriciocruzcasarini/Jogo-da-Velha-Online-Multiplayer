<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="xGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Background with rounded squircle for mobile icon -->
  <rect width="512" height="512" rx="112" fill="url(#bg)" />
  
  <!-- Subtle grid lines -->
  <line x1="190" y1="100" x2="190" y2="412" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <line x1="322" y1="100" x2="322" y2="412" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <line x1="100" y1="190" x2="412" y2="190" stroke="#334155" stroke-width="12" stroke-linecap="round" />
  <line x1="100" y1="322" x2="412" y2="322" stroke="#334155" stroke-width="12" stroke-linecap="round" />

  <!-- Stylized X -->
  <g filter="url(#glow)">
    <line x1="120" y1="120" x2="170" y2="170" stroke="url(#xGrad)" stroke-width="20" stroke-linecap="round" />
    <line x1="170" y1="120" x2="120" y2="170" stroke="url(#xGrad)" stroke-width="20" stroke-linecap="round" />
  </g>

  <!-- Stylized O -->
  <circle cx="367" cy="145" r="28" fill="none" stroke="url(#oGrad)" stroke-width="20" filter="url(#glow)" />

  <!-- Center X -->
  <g filter="url(#glow)">
    <line x1="226" y1="226" x2="286" y2="286" stroke="url(#xGrad)" stroke-width="22" stroke-linecap="round" />
    <line x1="286" y1="226" x2="226" y2="286" stroke="url(#xGrad)" stroke-width="22" stroke-linecap="round" />
  </g>

  <!-- Bottom right O -->
  <circle cx="367" cy="367" r="28" fill="none" stroke="url(#oGrad)" stroke-width="20" filter="url(#glow)" />
</svg>
